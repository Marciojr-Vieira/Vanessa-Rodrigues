services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vanessa
      POSTGRES_USER: vanessa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanessa -d vanessa"]
      interval: 5s
      timeout: 5s
      retries: 10
  site:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vanessa:${POSTGRES_PASSWORD}@postgres:5432/vanessa?schema=public
      NODE_ENV: production
      TRUST_PROXY: "true"
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:migrate && node --import tsx prisma/seed.ts && node server.js"]
volumes:
  database:
  uploads:
